- title: "ARENA Symposium - Abstract Representations in Neural Architectures: From Human Cognition to Artificial Intelligence"
  speaker: For more information, see Description
  date: 12 March 2025
  date_js: "2025-02-06T12:00:00"
  location: TeaP Conference 2025
  abstract: "How knowledge is represented in the human mind and brain is one of the most fundamental questions of cognitive and brain sciences. It is central to many domains of cognition—from visual perception and object recognition, learning of regularities and semantic knowledge about the world, to language processing. However, an overarching framework that is rich enough to capture knowledge representations at various depths and levels of abstraction is still lacking. In this regard, recent developments in artificial intelligence (AI), in particular Deep Neural Networks (DNNs), are making promising advances and will be exemplified in the talks of this symposium. In Talk 1, Triesch will present novel learning approaches for DNNs that exploit the temporal and/or multimodal structure of sensory information during infants’ extended interactions with objects. In Talk 2, Schommartz will present how gaze fixations during natural scene viewing differ between children and adults, and how predictions from AI models can help to understand the age differences. In Talk 3, Nicholls will present a study that examines to what extent hierarchical scene knowledge is represented on a neural level during object recognition. In Talk 4, Çelik will present a study that demonstrates LLMs as useful tools to semantically annotate a large pool of words out-of-context and modeling brain data while subjects listen to this audiobook. At the end, we will discuss to what extent such concerted efforts of psychologists and computer scientists improve the understanding of how representations emerge and are coded across different types of neural architecture.<br><br>

  <b>Talk 1: Computational Modeling of the Development of Abstract Object Representations</b><br><br>
  <b>Jochen Triesch</b><br>
  <i>Goethe-Universität Frankfurt</i><br><br>
  What are the origins of abstract knowledge about objects? Infants and toddlers learn about objects quite differently from today’s artificial intelligence systems. Here we aim to better understand these processes by developing computational models of how infants and toddlers acquire abstract object representations and the ability to recognize objects and object categories independent of viewpoint, distance, etc. For this, we have developed novel learning approaches for deep neural networks that exploit the temporal and/or multimodal structure of sensory information during extended interactions with objects. For example, we harness head-mounted eye tracking in toddlers and train computational models with toddlers’ first-person visual input, demonstrating that strong object representations can result from just minutes of such experience. Furthermore, we highlight the benefits of toddlers’ gaze behavior for successful learning. We also consider learning in models receiving computer-rendered visual inputs, where we can precisely control the input statistics. We show how additional linguistic input, even if rare and noisy, promotes the formation of abstract object categories. Furthermore, we demonstrate how our time-based learning approach can lead to the emergence of very abstract concepts such as „kitchen object“ or „garden object“. Finally, we study the role of behavior and knowledge of executed manipulation actions (e.g., how an object was turned) and demonstrate how this additional information can further enrich the learned representations. Overall, we elucidate what computational principles seem to underlie the emergence of abstract object representations in infants and toddlers.<br><br>

  <b>Talk 2: Eye Gaze Patterns and Reinstatement in Children, Adults, and Artificial Intelligence Models During Naturalistic Viewing</b><br><br>
  <b>Iryna Schommartz<sup>1,2</sup>, Bhavin Choksi<sup>3</sup>, Gemma Roig<sup>3</sup>, Yee Lee Shing<sup>1,2</sup></b><br>
  <i><sup>1</sup>Department of Psychology, Goethe University Frankfurt</i><br>
  <i><sup>2</sup>IDeA – Center for Individual Development and Adaptive Education</i><br>
  <i><sup>3</sup>Computer Science Department, Goethe University Frankfurt</i><br><br>
  In developmental research, differences in cognition and perception during image viewing can result in varied processing and subsequent memory of scene elements. Additionally, scan paths during scene perception may provide insights into pattern completion for partially incomplete images. However, the extent to which eye-gaze patterns predict subsequent memory and how these patterns differ between children and adults remains unclear. To investigate this, we measured gaze fixations while children (aged 6 to 11) and young adults (aged 19 to 30) viewed 60 naturalistic images. Later, gaze fixations were measured during image reinstatement on the blank screen after being cued with partially occluded images. Using the representational similarity analysis of the fixation-based heat maps, we observed that adults exhibited higher encoding-retrieval eye-gaze reinstatement than children, suggesting a prolonged developmental trajectory for eye-gaze reinstatement. It correlated with greater memory accuracy, reflecting the consolidation of scan paths. Further, we analyzed the differences between the scan paths in children and adults using MultiMatch—a metric measuring the similarity between scan paths across multiple dimensions. We observed consistent differences between the scan paths made by adults and children. We also used various state-of-the-art AI models to uncover further if they can preferentially predict the scan paths of an age group. We aim to thoroughly investigate and discuss our findings and their implications for both cognitive neuroscience as well as for building foveation-based AI models.<br><br>

  <b>Talk 3: Representations of Hierarchical Scene Information in the Brain</b><br><br>
  <b>Victoria I. Nicholls<sup>1</sup>, Lea Widmayer<sup>1</sup>, Melissa Võ<sup>1,2</sup></b><br>
  <i><sup>1</sup>Goethe University Frankfurt, Department of Psychology, Scene Grammar Lab</i><br>
  <i><sup>2</sup>Neuro-Cognitive Psychology, Department of Psychology, LMU Munich</i><br><br>
  Our knowledge of scenes is thought to have a hierarchical structure: at the lowest level are often smaller, local objects (e.g., a soap), followed by so-called “anchors,” often larger objects like a sink. Together they form a “phrase,” a meaningful and functionally organized subset of a scene. Multiple phrases combined form a scene. What has not been established so far is whether this hierarchical scene knowledge is represented on a neural level, which brain regions might be involved, and the dynamics of accessing this knowledge. To examine this, participants were presented with an isolated object (local or anchor) either as a word label, image, or target word in the context of a search task, followed by a blank period while we recorded MEG. Using representational similarity analysis (RSA) with models representing different levels of scene knowledge, we analyzed each stimulus presentation and blank period to determine whether participants access representations about the objects only or additionally access phrase and scene representations.<br><br>

  <b>Talk 4: Large Language Models as Artificial Semantic Annotators</b><br><br>
  <b>Emin Çelik, Mariya Toneva</b><br>
  <i>MPI for Software Systems, Saarbrücken, Germany</i><br><br>
  Comprehensive study of how the semantic representation of a word changes with context via human behavior or brain recordings is difficult due to the sheer number of possible contexts. Here, we considered large language models (LLMs) as a model organism that is tasked with assessing word meaning. As a first step, we tested whether LLMs can rate a large set of individual words across a number of semantic properties similarly to the way humans do. The words included abstract and concrete nouns, verbs, and adjectives. The semantic properties also covered a wide range, from sensory and motor to social and emotion-related properties. Specifically, we used GPT-4 Turbo and Llama3.1-8B to produce such ratings by using prompts that mimicked the original queries presented to human raters. We found that there was a close match between these rating estimates and those produced by humans. Overall, our results suggest that LLMs are useful tools to semantically annotate a large pool of words out-of-context. In the future, we plan to use our method to annotate a whole book with words in context and model fMRI and MEG data while subjects listen to this audiobook."
  recording: 
    
- title: "A compositional neural code of invariant visual word recognition"
  speaker: Dr. Aakash Agrawal 
  date: 11th March 2025 , 12:30 – 14:00
  date_js: "2025-02-06T12:00:00"
  location: PEG building, room 5G 129, Westend Campus, Goethe University
  abstract: Humans exhibit a remarkable ability to read words accurately even when their internal letters are jumbled, pointing to a robust yet flexible orthographic processing system. Concurrently, reading expertise refines the visual system to distinguish highly similar letters and track their relative positions, enabling us to differentiate between words like FORM and FROM across varying sizes and locations. To probe whether a common neural mechanism underlies these capabilities, we developed cognitive and computational models of invariant word recognition. First, behavioral experiments clarified how letters integrate into word forms. Next, convolutional neural networks trained to recognize words revealed precise mechanism of how word-selective units, which emerged with literacy training, encode letter identity, and positions relative to word boundaries. Finally, using 7T fMRI and MEG, we localized this “ordinal” code in the anterior ventral visual pathway (VWFA) and observed its emergence around 220 ms post-stimulus. This unified framework explains both our resilience to letter transpositions and our precise encoding of letter order, offering novel insights into the neuronal mechanisms underlying invariant word recognition in both human brains and artificial systems.
  recording: "https://hessenbox-a10.rz.uni-frankfurt.de/getlink/fiCHCzNkbRtuDMkmEDBLrY/video1023311821.mp4"
  
