  location: Seminar Haus, Room SH 0.106, Westend Campus, Goethe University, Frankfurt am Main
  abstract: "This crash course provides an overview of:<br>
  <b>(i) Gross brain anatomy</b> (e.g., central vs. peripheral nervous system, brain lobes);<br>
  <b>(ii) Functionally relevant systems</b> (e.g., prefrontal cortex, language system);<br>
  <b>(iii) Basic principles of functional neuroanatomy</b>, primarily illustrated through neuropsychological syndromes and functional neuroimaging findings.<br><br>
  
  On <b>Day 2</b> the <b>main focus</b> is on Language System; Parietal Cortex; Frontal Lobes; Functional Networks in the Brain."

- title: "ARENA Lecture Series: Unifying Social Learning Mechanisms through Representational Exchange"
  speaker: Dr. Charley Wu
  date: 22th July 2025, 12:00 - 14:00
  date_js: "2025-07-22T12:00:00"
  location: PEG Building, Room 5G 170, Westend Campus, Goethe University
  abstract: "Social learning shapes our behavior, helping us navigate complex environments more efficiently. Yet theories often treat individual learning mechanisms and social influence as distinct processes. I introduce the Representational Exchange Framework, which integrates diverse forms of social learning — policy-based, value-based, and model-based — under a unified computational hierarchy, balancing computational cost against flexibility and compositionality. I provide support across three studies. First, using a collective foraging experiment programmed in the game Minecraft, I combine visual field analyses with rich spatial trajectories to show how people dynamically integrate social and asocial learning mechanisms, where the degree of adaptivity best predicts individual performance. Second, I present a socially correlated bandit task to demonstrate how people flexibly integration social information about value, despite individual differences (e.g., preferences or goals). We demonstrate that our new social generalization model is the best normative model (via evolutionary simulations), while also providing the best predictions of human behavior across 2 experiments. Lastly, ongoing research employing a novel card task tests arbitration across policy-, value-, and model-based strategies, where with fMRI data, we hope to provide new insights into how cost-benefit evaluations guide social learning decisions. Together, these findings reveal fundamental principles underlying adaptive decision-making across multiple levels of social learning."
  recording: "https://hessenbox-a10.rz.uni-frankfurt.de/getlink/fi4Ujn1BeND3arPAoL8Drt/video1747485677.mp4"
  
- title: "ARENA Workshop: Brain in Two Days: A Crash Course in Structural and Functional Neuroanatomy for Cognitive Neuroscientists - Day 1"
  speaker: Professor Christian Fiebach
  date: 15th July 2025, 12:30 – 16:30
  date_js: "2025-07-15T12:30:00"
  location: PEG Building, Room 5G 170, Westend Campus, Goethe University, Frankfurt am Main
  abstract: "<b>This crash course will provide an overview of:</b><br>
  <b>(i) Gross brain anatomy</b> (e.g., central vs. peripheral nervous system, brain lobes);<br>
  <b>(ii) Functionally relevant systems</b> (e.g., prefrontal cortex, language system);<br>
  <b>(iii) Basic principles of functional neuroanatomy</b>, primarily illustrated through neuropsychological syndromes and functional neuroimaging findings.<br>
  Over the course of two half-day sessions, we will explore the perceptual systems, memory and language functions, and the roles of the parietal and prefrontal cortex. The course will conclude with broader reflections on brain function from a network-based perspective, moving beyond a strictly localizationist view of brain organization.  This crash course is especially designed for early-career researchers from related fields such as psychology, linguistics, and computer science who are interested in cognitive neuroscience and the brain.<br><br>
 
  <b>Time Plan:</b><br>
  Day 1: The Human Brain – A First Look; Perceptual Systems; Memory & Hippocampus (15 July 2025)<br>
  Day 2: Language System; Parietal Cortex; Frontal Lobes; Functional Networks in the Brain (23 July 2025)<br><br>
 
  This event is part of the ARENA Research Unit workshop series. Please feel free to share this announcement with your network and interested colleagues. We look forward to your participation."
