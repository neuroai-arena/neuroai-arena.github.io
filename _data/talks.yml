- title: "ARENA Lecture Series: Taming the neuroscience literature with predictive and explanatory models"
  speaker: Prof. Bradley Love
  date: 4th February 2025, 12:00 – 14:00
  date_js: "2025-02-04T12:00:00"
  location: DIPF building, Room Erwin Stein (1. OG), Westend Campus, Goethe University
  abstract: "Models can help scientists make sense of an exponentially growing literature. In the first part of the talk, I will discuss using models as predictive tools. In the BrainGPT.org project, we use large language models (LLMs) to order the scientific literature. On a benchmark, BrainBench, that involves predicting experimental results from methods, we find that LLMs exceed the capabilities of human experts. Because the confidence of LLMs is calibrated, they can team with neuroscientists to accelerate scientific discovery. In the second part of the talk, I focus on models that can provide explanations bridging behaviour and brain measures. Unlike predictive models, explanatory models can offer interpretations of key results. I'll discuss work that suggests intuitive cell types (e.g., place, grid, concept cells, etc.) are of limited scientific value and naturally arise in complex networks, including random networks. In this example, the explanatory model is serving as a baseline which should be surpassed prior to making strong scientific claims. I'll end by noting the complementary roles explanatory and predictive models play."
  recording: "https://hessenbox-a10.rz.uni-frankfurt.de/getlink/fiGyscA5LoRADb2dfrh58X/video1783023175.mp4"

- title: "ARENA Lecture Series: Neural Representations Underlying Flexible Behavior"
  speaker: Prof. Mona Garvert
  date: 26th November 2024 , 12:00 – 14:00 
  date_js: "2024-11-26T12:00:00"
  location: PEG building, seminar room 1G 150, Westend Campus, Goethe University
  abstract:  "In our ever-changing world, the ability to adapt to novel situations is essential. This flexibility relies on our ability to draw from past experiences and apply general principles to new situations. For example, when choosing from a menu in an unfamiliar restaurant, we instinctively apply past dining experiences to guide our decision. Such generalization is a cornerstone of adaptive behavior, allowing us to make informed decisions without relearning strategies for every new scenario. In this talk, I explore how the human brain enables such behavior. I will demonstrate that the brain constructs hippocampal cognitive maps, traditionally known for encoding spatial relationships, to also represent other types of relational knowledge, providing a flexible foundation for generalization and novel inference. When stimuli can be part of multiple relational maps, the orbitofrontal cortex selectively activates relevant maps tailored to the specific task. Additionally, our research reveals that with time and consolidation, the brain refines these cognitive maps into more abstract representations, capturing the broader relational structure of experiences beyond specific stimuli. In summary, our findings illustrate the remarkable adaptability of neural representations in the human brain. They demonstrate how these representations are not just static archives of past experiences but are dynamic tools actively reshaped to aid decision-making and behavior in ever-changing environments."
  recording: "https://hessenbox-a10.rz.uni-frankfurt.de/getlink/fi3FsZaw4GCod6TETzScqB/video1208723741.mp4 "


