- title: "ARENA Workshop: A Crash Course in Structural and Functional Neuroanatomy for Cognitive Neuroscientists - Day 3"
  speaker: Professor Christian Fiebach
  date: 03 November 2025, 14:00 – 16:30
  date_js: "2025-11-03T12:00:00"
  location: PEG building, Room 3G 170, Westend Campus, Goethe University, Frankfurt am Main 
  abstract: "This session will focus on: Parietal Cortex; Frontal Lobes; Network Perspective on Human Brain Function
In this third part of the neuroanatomy crash course for cognitive neuroscientists, three topics will be covered, (i) the parietal cortex and (ii) the frontal lobes, both with respect to their anatomical organization but also basic insights into their functions. In the last part, (iii) a network perspective on human brain function is considered, introducing some widely accepted concepts like intrinsic connectivity networks, the default mode network of brain function, or the distinction between task positive and task negative functional brain networks.

Below is an overview of the day: 

14:00 - 14:30
Parietal Cortex, Anatomy: inferior vs. superior parietal lobule; angular gyrus, supramargninal gyrus, lateral vs. medial parietal lobe. Function: neuropsychological deficits - neglect, apraxia, acalculia; attention functions of the parietal lobe. 

14:30 - 15:30
Frontal Lobes, Anatomy: frontal lobe vs. prefrontal cortex, DLPFC vs. VLPFC vs. OFC vs VMPFC, SMA, FEF, ACC. Function: Phineas Gage, dysexecutive syndrome, WM organization in PFC, IFJ, functional fractionation vs. hierarchical models,conflict & ACC, mirror neurons & action planning

15:30 - 16:00 
Network Perspective on Human Brain Function, localization vs. network neuroscience. Functional network models: Mesulam, DMN, TPN vs TNN, etc. Perception-Action-Cycle (Fuster)"


- title: "ARENA Workshop: Aligning Humans and Language Models: how to investigate emergent properties of geometrical spaces"
  speaker: Dr. Cosimo Iaia and Dr. Bhavin Choksi
  date: 07th October 2025, 12:00 - 14:00
  date_js: "2025-10-07T12:00:00"
  location: PEG Building, Room 5G 170, Westend Campus, Goethe University
  abstract: "Studying abstract representations has a long history in both cognitive neuroscience and computer science. In recent years cognitive scientist, neuroscientist, psychologists, and linguists have leveraged advancement in machine learning and AI to study the nature of representations across multiple domains, and whether these representations are shared between humans and machines (Sucholutsky, Muttenthaler et al. 2023).This workshop will be split into sections. In the first section we will demonstrate how to extract vector representations from language models and how to model meaning in a geometrical space, according to a prior hypothesis. In the second sections we will show how to measure the degree of agreement between human behavior and language models through Representational similarity analysis (RSA, Kriegeskorte et al., 2008). Lastly, we will demonstrate how to directly interpret information related to theoretically informed variables from word representations in a geometrical space, replicating some recent results (Iaia et al., 2025)."


- title: "ARENA Workshop: Brain in Two Days: A Crash Course in Structural and Functional Neuroanatomy for Cognitive Neuroscientists - Day 2"
  speaker: Professor Christian Fiebach
  date: 23th July 2025, 14:30 – 17:30
